interface:
  display_name: "成本优先 SubAgent 路由"
  short_description: "Luna Only / Adaptive，选择最低足够 Worker"
  default_prompt: "使用 $codex-luna-subagent-router，仅在委派有净收益时选择最低足够 model + reasoning。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: ["openai"]
  activation:
    mode: "implicit-with-standing-user-authorization"
    paths: []
  execution:
    context: "fork"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "deny"
  degradation:
    openai: "If exact Worker model and reasoning cannot be verified, keep the task in the Lead."
