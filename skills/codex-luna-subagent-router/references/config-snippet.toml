# 可选合并到 ~/.codex/config.toml 或项目级 .codex/config.toml。
# 即使某次 spawn 遗漏 model，也把默认 Worker 限制在最低成本的 Luna；
# 本 Skill 仍要求每个 Worker 显式 profile 或显式 live spawn 参数。

[agents]
enabled = true
default_subagent_model = "gpt-5.6-luna"

# 现代 Host 的 canonical spawned-agent 并发上限，不包含主线程。
# Host schema 未确认或需要兼容旧 V2 时，不要直接复制此字段；运行
# scripts/configure_subagent_limit.py --max-subagents 3 --schema auto。
# 本 Skill 推荐 3，并且即使这里设置得更高，本 Skill 默认单波仍最多 3 个 Worker。
max_concurrent_threads_per_session = 3

# 不设置统一 reasoning；每个子任务单独选择。
# default_subagent_reasoning_effort = "..."

# 可选实验性 Default 模式提问开关；只有用户明确选择后由安装器写入。
# [features]
# default_mode_request_user_input = true

# Agent Router 的 routing.json 独立存放在：
#   ~/.codex/codex-luna-subagent-router/routing.json
# 或项目 .codex/codex-luna-subagent-router/routing.json。
# v2.7 Core Execution Shape / Materialization Gate / Runtime Health Lease
# 由 routing.json 2.1 管理；Decision Engine 默认关闭，必须显式 opt-in。
