name: Release

# Publishing is an explicit maintainer operation, never a side effect of a PR or CI run.
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Exact reviewed main commit (40-character SHA)'
        required: true
        type: string
      confirmation:
        description: 'Enter publish-vX.Y.Z matching VERSION'
        required: true
        type: string

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Check explicit release target and approval
        id: check
        env:
          EXPECTED: ${{ inputs.commit_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED" ]]
          VERSION=$(cat skills/codex-luna-subagent-router/VERSION)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$CONFIRMATION" == "publish-v$VERSION" ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify complete source manifest and regressions
        run: |
          python tools/verify_manifest.py
          python -m unittest discover -s skills/codex-luna-subagent-router/tests -v
  packages:
    needs: authorize
    uses: ./.github/workflows/portable-runtime.yml
    with:
      ref: ${{ inputs.commit_sha }}
    permissions:
      contents: read
  publish:
    needs: [authorize, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: packages
          merge-multiple: true
      - name: Check all four archives and their hashes before publication
        shell: python
        env:
          VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          import hashlib, os
          from pathlib import Path
          root = Path('packages')
          names = [f"router-{os.environ['VERSION']}-{target}.{ext}" for target, ext in
                   [('windows-x64','zip'),('windows-arm64','zip'),('macos-x64','tar.gz'),('macos-arm64','tar.gz')]]
          assert {p.name for p in root.iterdir()} == set(names + [n+'.sha256' for n in names])
          lines = []
          for name in names:
              line = (root / (name+'.sha256')).read_text().strip()
              digest, recorded_name = line.split('  ',1)
              assert recorded_name == name
              assert hashlib.sha256((root/name).read_bytes()).hexdigest() == digest
              lines.append(line)
          (root/'SHA256SUMS').write_text('\n'.join(lines)+'\n')
      - name: Create release only after all package tests pass
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.authorize.outputs.version }}
          TARGET: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Existing release is immutable to this workflow; manual review required.' >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo 'Tag already exists; refusing to move it.' >&2
            exit 1
          fi
          gh release create "$TAG" --target "$TARGET" --title "$TAG" --draft --notes "Complete platform packages with pinned private CPython. See CHANGELOG.md and the portable-runtime guide."
          gh release upload "$TAG" packages/*
          gh release edit "$TAG" --draft=false
