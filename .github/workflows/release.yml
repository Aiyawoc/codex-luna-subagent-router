name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve version and release target
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < skills/codex-luna-subagent-router/VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version: $version" >&2
            exit 1
          fi

          target="$(git log -1 --format=%H "${{ github.event.workflow_run.head_sha }}" -- skills/codex-luna-subagent-router/VERSION)"
          if [[ -z "$target" ]]; then
            echo "Unable to resolve the commit that introduced VERSION=$version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub Release when absent
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_TARGET: ${{ steps.version.outputs.target }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const version = process.env.RELEASE_VERSION;
            const tag = process.env.RELEASE_TAG;
            const target = process.env.RELEASE_TARGET;

            let existingRef = null;
            try {
              const response = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              existingRef = response.data.object.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (existingRef && existingRef !== target) {
              core.setFailed(`${tag} already points to ${existingRef}, expected ${target}`);
              return;
            }
            if (!existingRef) {
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha: target });
            }

            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.info(`Release ${tag} already exists; leaving it unchanged.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
            const heading = `## ${version}`;
            const sectionStart = changelog.indexOf(heading);
            const contentStart = sectionStart < 0 ? -1 : changelog.indexOf("\n", sectionStart);
            const nextSection = contentStart < 0 ? -1 : changelog.indexOf("\n## ", contentStart + 1);
            const body = contentStart < 0
              ? `Release ${tag}.`
              : changelog.slice(contentStart + 1, nextSection < 0 ? undefined : nextSection).trim();

            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: target,
              name: tag,
              body,
              draft: false,
              prerelease: false,
            });
