name: Apply compact Stop summary once

on:
  push:
    branches: ["fix/compact-stop-hook-summary"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compact-stop-hook-summary
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply compact Stop Hook summary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          turn_path = Path("skills/codex-luna-subagent-router/scripts/turn_usage.py")
          text = turn_path.read_text(encoding="utf-8")

          old = '''def report(row, heading="本轮 token 用量（已登记线程，本轮起点至当前快照）", *, include_context=False):
              snapshots = [row["main_snapshot"], *row["child_snapshots"].values()]
              aggregate = usage.aggregate_snapshots(snapshots)
              if row["excluded_children"]:
                  aggregate["status"] = "partial" if aggregate["counts"]["total_tokens"] is not None else "unavailable"
                  aggregate["reasons"] = sorted(set(aggregate["reasons"]) | {"unassociated_children"})
              lines = [heading, usage.summary(row["main_snapshot"], "主 Agent · " + usage.model_label(row["main_snapshot"]))]
              for agent, snap in row["child_snapshots"].items():
                  lines.append(usage.summary(snap, "子 Agent · " + usage.model_label(snap) + " · " + agent[-6:]))
              lines.append(usage.summary(aggregate, "本轮已知合计（含缓存）"))
              lines.append(f"已登记范围：完整 {aggregate['complete']} / 待确认 {aggregate['waiting']} / 部分 {aggregate['partial']} / 不可用 {aggregate['unavailable']}；不含未关联线程，不是账单。")
              if row["excluded_children"]:
                  lines.append(f"本轮另有 {row['excluded_children']} 个已触发子线程无法安全关联，未计入。")
              if include_context:
                  lines.insert(1, diagnostics.context_line(row))
              return "\\n".join(lines)
          '''

          new = '''def _cache_percent(counts):
              input_tokens = counts["input_tokens"]
              cached_tokens = counts["cached_input_tokens"]
              if input_tokens is None or cached_tokens is None:
                  return None
              if input_tokens == 0:
                  return 0 if cached_tokens == 0 else None
              return (cached_tokens * 100 + input_tokens // 2) // input_tokens


          def _usage_line(snapshot):
              counts = snapshot["counts"]
              cached = usage.compact(counts["cached_input_tokens"])
              percent = _cache_percent(counts)
              if percent is not None:
                  cached += f" {percent}%"
              return (f"输入 {usage.compact(counts['input_tokens'])}（缓存 {cached}）"
                      f" · 输出 {usage.compact(counts['output_tokens'])}")


          def report(row, heading="本轮 Token 用量", *, include_context=False):
              snapshots = [row["main_snapshot"], *row["child_snapshots"].values()]
              aggregate = usage.aggregate_snapshots(snapshots)
              if row["excluded_children"]:
                  aggregate["status"] = "partial" if aggregate["counts"]["total_tokens"] is not None else "unavailable"
                  aggregate["reasons"] = sorted(set(aggregate["reasons"]) | {"unassociated_children"})

              lines = [heading]
              if include_context:
                  lines.append(diagnostics.context_line(row))
              lines.extend(["", "主 Agent · " + usage.model_label(row["main_snapshot"]), _usage_line(row["main_snapshot"])])

              for agent, snap in row["child_snapshots"].items():
                  lines.extend(["", "子 Agent · " + usage.model_label(snap) + " · " + agent[-6:], _usage_line(snap)])

              if len(snapshots) > 1:
                  lines.extend(["", "本轮合计", _usage_line(aggregate)])

              lines.extend([
                  "",
                  f"完整度：完整 {aggregate['complete']} · 待确认 {aggregate['waiting']} · 部分 {aggregate['partial']} · 不可用 {aggregate['unavailable']}",
                  "范围：仅已登记线程，不是账单。",
              ])
              if row["excluded_children"]:
                  lines.append(f"未关联线程：{row['excluded_children']}（未计入）")
              return "\\n".join(lines)
          '''

          if old not in text:
              raise SystemExit("expected report block not found")
          turn_path.write_text(text.replace(old, new), encoding="utf-8")

          test_path = Path("skills/codex-luna-subagent-router/tests/test_turn_usage.py")
          tests = test_path.read_text(encoding="utf-8")
          tests = tests.replace(
              "self.assertIn('主 Agent · Astra high',out['systemMessage']);self.assertIn('总量 45k',out['systemMessage'])",
              "self.assertIn('主 Agent · Astra high',out['systemMessage']);self.assertIn('输入 42k（缓存 30k 71%） · 输出 3k',out['systemMessage'])"
          )
          tests = tests.replace(
              "self.assertIn('本轮已知合计（含缓存） | 总量 90k',out['systemMessage'])",
              "self.assertIn('本轮合计\\n输入 84k（缓存 60k 71%） · 输出 6k',out['systemMessage'])"
          )
          needle = "    def test_two_turns_not_session_cumulative(self):\n"
          added = (
              "    def test_stop_summary_is_compact_with_blank_lines(self):\n"
              "        self.hook();self.add([ctx(),event(),terminal()]);out=self.hook('Stop')\n"
              "        text=out['systemMessage']\n"
              "        self.assertIn('本轮 Token 用量\\n\\n主 Agent · Astra high\\n输入 42k（缓存 30k 71%） · 输出 3k\\n\\n完整度：完整 1 · 待确认 0 · 部分 0 · 不可用 0',text)\n"
              "        self.assertNotIn('完整快照',text)\n"
              "        self.assertNotIn('本轮已知合计',text)\n"
              "        self.assertNotIn('总量 ',text)\n"
              "\n"
          )
          if needle not in tests:
              raise SystemExit("test insertion point not found")
          tests = tests.replace(needle, added + needle, 1)
          tests = tests.replace(
              "self.hook();self.add([ctx(),event()]);out=self.hook('Stop');self.assertIn('待确认',out['systemMessage'])",
              "self.hook();self.add([ctx(),event()]);out=self.hook('Stop');self.assertIn('待确认 1',out['systemMessage']);self.assertNotIn('未读到结束事件',out['systemMessage'])"
          )
          test_path.write_text(tests, encoding="utf-8")

          manifest_path = Path("MANIFEST.sha256")
          lines = manifest_path.read_text(encoding="utf-8").splitlines()
          changed = {
              turn_path.as_posix(): hashlib.sha256(turn_path.read_bytes()).hexdigest(),
              test_path.as_posix(): hashlib.sha256(test_path.read_bytes()).hexdigest(),
          }
          out = []
          seen = set()
          for line in lines:
              digest, path = line.split("  ", 1)
              if path in changed:
                  digest = changed[path]
                  seen.add(path)
              out.append(f"{digest}  {path}")
          if seen != set(changed):
              raise SystemExit(f"manifest paths missing: {set(changed) - seen}")
          manifest_path.write_text("\n".join(out) + "\n", encoding="utf-8")
          PY
      - name: Remove one-shot workflow
        run: git rm .github/workflows/apply-compact-stop-summary-once.yml
      - name: Verify and test
        run: |
          python tools/verify_manifest.py
          python -m unittest discover -s skills/codex-luna-subagent-router/tests -v
          git diff --check
          test "$(grep -c 'display_name: "Agent Router"' skills/codex-luna-subagent-router/agents/interface.yaml)" -eq 1
      - name: Commit final change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/codex-luna-subagent-router/scripts/turn_usage.py \
                  skills/codex-luna-subagent-router/tests/test_turn_usage.py \
                  MANIFEST.sha256
          git commit -m "fix: 精简 Stop Hook Token 摘要"
          git push origin HEAD:fix/compact-stop-hook-summary
