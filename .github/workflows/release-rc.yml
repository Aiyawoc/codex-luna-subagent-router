name: Release Candidate

# RC publication is triggered only by an explicitly created publish/vX.Y.Z-rc.N branch.
# Stable publication remains exclusively controlled by release.yml.
on:
  push:
    branches:
      - 'publish/**'

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Check exact RC branch and version
        id: check
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(cat skills/codex-luna-subagent-router/VERSION)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]
          [[ "$GITHUB_REF_NAME" == "publish/v$VERSION" ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact RC source
        run: |
          python tools/verify_manifest.py
          python -m unittest discover -s skills/codex-luna-subagent-router/tests -v
          python benchmarks/router_arena.py route-audit

  packages:
    needs: authorize
    uses: ./.github/workflows/portable-runtime.yml
    with:
      ref: ${{ github.sha }}
    permissions:
      contents: read

  publish:
    needs: [authorize, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: packages
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          path: packages
          merge-multiple: true
      - name: Verify all four complete and four plugin RC archives and hashes
        shell: python
        env:
          VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          import hashlib, os
          from pathlib import Path
          root = Path('packages')
          names = [f"{prefix}-{os.environ['VERSION']}-{target}.{ext}"
                   for prefix in ('router', 'router-plugin')
                   for target, ext in [('windows-x64','zip'),('windows-arm64','zip'),('macos-x64','tar.gz'),('macos-arm64','tar.gz')]]
          assert {p.name for p in root.iterdir()} == set(names + [n+'.sha256' for n in names])
          lines = []
          for name in names:
              line = (root / (name+'.sha256')).read_text().strip()
              digest, recorded_name = line.split('  ', 1)
              assert recorded_name == name
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest
              lines.append(line)
          (root / 'SHA256SUMS').write_text('\n'.join(lines) + '\n')
      - name: Publish immutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.authorize.outputs.version }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Existing RC release is immutable; refusing to overwrite.' >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo 'RC tag already exists; refusing to move it.' >&2
            exit 1
          fi
          gh release create "$TAG" --target "$TARGET" --title "$TAG" --prerelease --draft \
            --notes "Agent Router $TAG release candidate. Feature-frozen for real Host capability/event and benchmark field acceptance. Native evidence, benchmark review and Decision providers remain non-authoritative. Includes complete packages plus opt-in local-marketplace plugin packages. See CHANGELOG.md and docs/v2.9.0-rc1-acceptance.md."
          gh release upload "$TAG" packages/*
          gh release edit "$TAG" --draft=false
