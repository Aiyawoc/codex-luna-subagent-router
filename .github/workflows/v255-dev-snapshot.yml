name: v255 dev snapshot
on:
  push:
    branches: [v2.5.5-host-first-concurrency]
    paths: [.github/workflows/v255-dev-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip HEAD -o v255-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: v255-source
          path: v255-source.zip
          retention-days: 1
