name: Apply v2.6.3 Patch Once

on:
  push:
    branches: ["feat/v2.6.3-evidence-reuse"]
    paths: [".github/workflows/apply-v263-patch.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2.6.3-evidence-reuse
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply reviewed v2.6.3 patch and validate
        run: |
          set -euo pipefail
          base64 -d .github/v263-patch/v263.patch.gz.b64 | gzip -d > /tmp/v263.patch
          git apply --check /tmp/v263.patch
          git apply /tmp/v263.patch
          git rm -r .github/v263-patch
          git rm .github/workflows/apply-v263-patch.yml
          python tools/verify_manifest.py
          python -m unittest discover -s skills/codex-luna-subagent-router/tests -v
          test "$(wc -c < skills/codex-luna-subagent-router/SKILL.md)" -lt 6000
          git diff --check
      - name: Commit final v2.6.3 source tree
        run: |
          set -euo pipefail
          git config user.name "Ethen Lee"
          git config user.email "soldiers@vip.qq.com"
          git add -A
          git commit -m "feat: v2.6.3 新增 Evidence reuse 证据复用"
          git push origin HEAD:feat/v2.6.3-evidence-reuse
