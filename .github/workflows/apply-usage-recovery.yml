name: Apply Usage Recovery
on:
  push:
    branches: [fix/v2.6.1-usage-recovery]
    paths: [.github/workflows/apply-usage-recovery.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Aiyawoc/codex-luna-subagent-router' && github.actor == 'Aiyawoc'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact source edits and remove transport files
        shell: python
        run: |
          import base64, hashlib, json, lzma, pathlib, subprocess
          parts = [pathlib.Path(f'.github/usage-recovery.{i}.b64') for i in range(4)]
          raw = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True))
          assert hashlib.sha256(raw).hexdigest() == '25803f6676b2ff245486786215d5da2ea57f35bcac6885652a0414c7aadcd5aa'
          paths = []
          for change in json.loads(raw):
              path = pathlib.Path(change['path'])
              assert not path.is_absolute() and '..' not in path.parts
              old = path.read_bytes() if path.exists() else b''
              if change['before'] is None:
                  assert not path.exists(), str(path)
              else:
                  assert hashlib.sha256(old).hexdigest() == change['before'], str(path)
              lines = old.decode().splitlines(keepends=True)
              for start, end, replacement in reversed(change['edits']):
                  lines[start:end] = replacement
              new = ''.join(lines).encode()
              assert hashlib.sha256(new).hexdigest() == change['after'], str(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(new)
              paths.append(str(path))
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','rm','--',*map(str,parts),'.github/workflows/apply-usage-recovery.yml'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          tree = subprocess.check_output(['git','write-tree']).decode().strip()
          assert tree == '59bf002aeef306f37bc4fe789599fa191b146ae1', tree
      - name: Commit to feature branch only, no force or release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: v2.6.1 用量边界续读、重复头校验与历史复核诊断'
          git push origin HEAD:fix/v2.6.1-usage-recovery
