name: Apply v2.6.2 Fixed Panel
on:
  push:
    branches: [feat/v2.6.2-report]
    paths: [.github/workflows/apply-v2.6.2-panel.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Aiyawoc/codex-luna-subagent-router' && github.actor == 'Aiyawoc'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify and apply tested panel patch
        shell: python
        run: |
          import base64, hashlib, lzma, pathlib, subprocess
          source = pathlib.Path('.github/v262-panel.patch.b64')
          raw = lzma.decompress(base64.b64decode(source.read_text().strip(), validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'ca5b2c7ff2312a94b2e9edc3e1bef1cf7db9211784efa462591899ceebe36304'
          subprocess.run(['git','apply','--index','-'], input=raw, check=True)
          subprocess.run(['git','rm',str(source),'.github/workflows/apply-v2.6.2-panel.yml'], check=True)
          subprocess.run(['git','diff','--cached','--check'], check=True)
      - name: Verify fixed panel and full regression suite
        run: |
          python3 tools/verify_manifest.py
          test "$(wc -c < skills/codex-luna-subagent-router/SKILL.md)" -lt 6000
          python3 -m unittest discover -s skills/codex-luna-subagent-router/tests -q
          TMP="$(mktemp -d)"
          CODEX_HOME="$TMP/.codex" python3 skills/codex-luna-subagent-router/scripts/report.py --global-scope --output-dir "$TMP/out" > "$TMP/panel.txt"
          grep -F '## 核心指标' "$TMP/panel.txt"
          grep -F '## Token 完整度' "$TMP/panel.txt"
          grep -F '## 已知用量' "$TMP/panel.txt"
          grep -F '## 模型使用' "$TMP/panel.txt"
          grep -F '## 验收结果' "$TMP/panel.txt"
          grep -F '## ⚠️ 需要关注' "$TMP/panel.txt"
      - name: Commit final v2.6.2 panel
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: v2.6.2 固定聊天面板输出'
          git push origin HEAD:feat/v2.6.2-report
