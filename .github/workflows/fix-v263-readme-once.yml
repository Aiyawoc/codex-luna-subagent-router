name: Fix v2.6.3 README Once

on:
  push:
    branches: ["docs/v2.6.3-readme-final"]
    paths: [".github/workflows/fix-v263-readme-once.yml"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/v2.6.3-readme-final
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fix README version references and validate
        shell: python
        run: |
          from pathlib import Path
          import hashlib

          fixes = {
              "README.md": [
                  ("router-2.6.2-", "router-2.6.3-"),
                  ("v2.6.3 提供一键统计简报：", "自 v2.6.2 起提供一键统计简报："),
                  ("[v2.6.3 数据简报](docs/v2.6.3-report.md)", "[v2.6.2 数据简报](docs/v2.6.2-report.md)"),
              ],
              "README.en.md": [
                  ("router-2.6.2-", "router-2.6.3-"),
                  ("v2.6.3 adds a one-command statistics brief:", "Since v2.6.2, the Router includes a one-command statistics brief:"),
                  ("[v2.6.3 data brief](docs/v2.6.3-report.md)", "[v2.6.2 data brief](docs/v2.6.2-report.md)"),
              ],
          }

          for name, replacements in fixes.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f"expected README text missing: {name}: {old}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          manifest_path = Path("MANIFEST.sha256")
          lines = manifest_path.read_text(encoding="utf-8").splitlines()
          for name in fixes:
              digest = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              suffix = f"  {name}"
              matches = [i for i, line in enumerate(lines) if line.endswith(suffix)]
              if len(matches) != 1:
                  raise SystemExit(f"manifest entry count for {name}: {len(matches)}")
              lines[matches[0]] = f"{digest}{suffix}"
          manifest_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
      - name: Remove one-shot workflow and run full validation
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-v263-readme-once.yml
          python tools/verify_manifest.py
          python -m unittest discover -s skills/codex-luna-subagent-router/tests -v
          test "$(wc -c < skills/codex-luna-subagent-router/SKILL.md)" -lt 6000
          git diff --check
          grep -q 'router-2.6.3-macos-arm64.tar.gz' README.md
          grep -q 'router-2.6.3-windows-x64.zip' README.en.md
          grep -q 'docs/v2.6.2-report.md' README.md
          grep -q 'docs/v2.6.2-report.md' README.en.md
          ! grep -q 'router-2.6.2-' README.md
          ! grep -q 'router-2.6.2-' README.en.md
          ! grep -q 'docs/v2.6.3-report.md' README.md
          ! grep -q 'docs/v2.6.3-report.md' README.en.md
      - name: Commit final README correction
        run: |
          set -euo pipefail
          git config user.name "Ethen Lee"
          git config user.email "soldiers@vip.qq.com"
          git add -A
          git commit -m "docs: 修正 v2.6.3 README 版本引用"
          git push origin HEAD:docs/v2.6.3-readme-final
