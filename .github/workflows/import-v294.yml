name: Import verified v2.9.4 candidate (temporary)

on:
  push:
    branches: [feature/v2.9.4-shadow-checkpoints]
    paths: [.github/workflows/import-v294.yml]

permissions:
  contents: read

jobs:
  import:
    if: github.ref == 'refs/heads/feature/v2.9.4-shadow-checkpoints'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify exact base, transport hashes, and tested candidate tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, bz2, hashlib, os, subprocess
          from pathlib import Path
          BASE = '3bd61e6e0ac693258efa03fbb109e3b4085cf4dc'
          TREE = '6a1c0ee08e7bdb163472a701966f60747670bd69'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert os.environ['GITHUB_REF'] == 'refs/heads/feature/v2.9.4-shadow-checkpoints'
          assert git('rev-parse', 'HEAD') == os.environ['GITHUB_SHA']
          assert git('rev-parse', 'HEAD^') == BASE
          assert set(git('diff-tree', '--no-commit-id', '--name-only', '-r', 'HEAD').splitlines()) == {
              '.github/source-transport-v294.bz2', '.github/workflows/import-v294.yml'}
          raw = Path('.github/source-transport-v294.bz2').read_bytes()
          assert len(raw) == 25468
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest() == '6bc31518a41fa09849d5f811330692dc3d77c1de'
          # The connector transport inserted three known base64 transcription
          # differences. Normalize them, then require the original local hashes.
          encoded = base64.b64encode(raw).decode('ascii')
          for received, intended in (
              ('fpTeqfqg5IbUA', 'fpTeqfqR5IbUA'),
              ('giSgjEgjEwoFFIo', 'giSgjEwoFFIo'),
              ('RlicBfMwYwB2M', 'RlicBfMwYB2M'),
          ):
              assert encoded.count(received) == 1
              encoded = encoded.replace(received, intended)
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == 'bacb419dcbb46eac60bab5df3836b10d7bdd3979be16f3af16628d9f8d16959d'
          patch = bz2.decompress(compressed)
          assert len(patch) == 97815
          assert hashlib.sha256(patch).hexdigest() == 'a8d0ac1e1bd882208f81625ef6a8b3d0f4423f937868d1cd1b61bbb272017b2c'
          subprocess.run(['git','rm','.github/source-transport-v294.bz2','.github/workflows/import-v294.yml'],check=True)
          subprocess.run(['git','apply','--index','--unidiff-zero','--whitespace=error-all','-'],input=patch,check=True)
          assert git('write-tree') == TREE, 'Remote tree differs from locally tested source'
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['python3','tools/verify_manifest.py'],check=True)
          print('Exact tested candidate tree verified:', TREE)
          PY
      - name: Commit verified source only to the feature branch
        shell: bash
        env:
          TARGET_BRANCH: feature/v2.9.4-shadow-checkpoints
        run: |
          set -euo pipefail
          test "$(git write-tree)" = 6a1c0ee08e7bdb163472a701966f60747670bd69
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: wire opt-in Shadow checkpoints into planning (v2.9.4-rc.1)'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
