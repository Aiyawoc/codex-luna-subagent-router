name: Publish v2.6.3 Once

on:
  push:
    branches: ["release/v2.6.3-publish"]
    paths: [".github/workflows/publish-v2.6.3-once.yml"]

permissions:
  contents: read

env:
  TARGET_SHA: 9a2874dc85d1b25b82ddba27e698c1d306ffefab
  RELEASE_VERSION: 2.6.3

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm reviewed main target and unpublished version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq .object.sha)"
          test "$MAIN_SHA" = "$TARGET_SHA"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Tag v${RELEASE_VERSION} already exists; refusing duplicate publication." >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Release v${RELEASE_VERSION} already exists; refusing duplicate publication." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Confirm version and source integrity
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < skills/codex-luna-subagent-router/VERSION)" = "$RELEASE_VERSION"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify manifest and full regression suite
        run: |
          python tools/verify_manifest.py
          python -m unittest discover -s skills/codex-luna-subagent-router/tests -v
          test "$(wc -c < skills/codex-luna-subagent-router/SKILL.md)" -lt 6000

  packages:
    needs: authorize
    uses: ./.github/workflows/portable-runtime.yml
    with:
      ref: 9a2874dc85d1b25b82ddba27e698c1d306ffefab
    permissions:
      contents: read

  publish:
    needs: [authorize, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: packages
          merge-multiple: true
      - name: Verify all four complete platform archives
        shell: python
        run: |
          import hashlib
          import os
          from pathlib import Path
          version = os.environ['RELEASE_VERSION']
          root = Path('packages')
          names = [
              f'router-{version}-windows-x64.zip',
              f'router-{version}-windows-arm64.zip',
              f'router-{version}-macos-x64.tar.gz',
              f'router-{version}-macos-arm64.tar.gz',
          ]
          expected = set(names + [name + '.sha256' for name in names])
          actual = {p.name for p in root.iterdir()}
          assert actual == expected, (actual, expected)
          lines = []
          for name in names:
              digest, recorded = (root / (name + '.sha256')).read_text(encoding='utf-8').strip().split('  ', 1)
              assert recorded == name
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest
              lines.append(f'{digest}  {name}')
          (root / 'SHA256SUMS').write_text('\n'.join(lines) + '\n', encoding='utf-8')
      - name: Publish v2.6.3 stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > RELEASE_NOTES.md <<'EOF'
          ## v2.6.3

          当前稳定版。本版本在 Compact Worker Task Packet 中增加 **Evidence reuse** 证据复用协议，并同步用户文档；不新增 MCP 或特定外部工具依赖，不改变路由策略、并发、hooks、token 采集、outcome 校准或账本格式。

          ### Evidence reuse
          - `references/task-packet.md` 是 Evidence reuse 的唯一协议定义位置。
          - Lead 可通过通用 `evidence_packet` 传递已确认事实、定位、关系、可选来源、待补证据缺口与无需重复的调查。
          - Worker 默认复用仍可信的已有证据，并优先补齐 `evidence_gaps`；证据不足、过期、冲突、不可验证或明确要求独立复核时才重新调查。
          - `do_not_repeat` 不会跳过验收条件、安全检查、必要验证或独立复核。
          - Evidence reuse 与 Worker 线程复用相互独立：fresh Worker 也可以复用证据；复用旧 Worker 也不会使旧证据自动有效。
          - 同时存在复用证据与新发现时，Worker 以 `reused:` / `new:` 区分，Lead 去重整合并更新 gaps。

          ### 用户体验与兼容性
          - README / README.en.md 已更新到 v2.6.3，并增加 Evidence reuse 的用户级说明。
          - v2.6.2 的 `router report`、固定聊天简报、JSON/CSV 导出继续保留。
          - 四个平台完整包继续内置固定 CPython 3.13.15，不依赖系统 Python、pip、uv 或 PATH。

          ### 验证
          - 332 项回归测试通过。
          - 114 个 tracked files Manifest 完整匹配。
          - `SKILL.md` 5923 bytes，继续满足 `<6000` 指令预算。
          - Windows x64 / ARM64 与 macOS Intel / Apple Silicon 四个平台完整包均使用随包 Python 完成 smoke、安装升级、hooks 和完整回归。
          - Release 附带四个平台完整包、逐包 `.sha256` 与汇总 `SHA256SUMS`。

          > GitHub 自动生成的 “Source code” ZIP/TAR 不包含 Python 运行时。需要免系统 Python 安装时，请下载下方对应平台的 `router-2.6.3-*` 完整包。
          EOF
          TAG="v${RELEASE_VERSION}"
          gh release create "$TAG" --target "$TARGET_SHA" --title "$TAG" --draft --notes-file RELEASE_NOTES.md
          gh release upload "$TAG" packages/*
          gh release edit "$TAG" --draft=false --prerelease=false
