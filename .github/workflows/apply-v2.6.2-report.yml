name: Apply v2.6.2 Report Patch
on:
  push:
    branches: [feat/v2.6.2-report]
    paths: [.github/workflows/apply-v2.6.2-report.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Aiyawoc/codex-luna-subagent-router' && github.actor == 'Aiyawoc'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      # New v2.6.2 files are pre-created because a plain git diff does not include staged/untracked additions.
      - name: Verify and apply tested patch
        shell: python
        run: |
          import base64, hashlib, lzma, pathlib, subprocess
          source = pathlib.Path('.github/v262-report.patch.b64')
          raw = lzma.decompress(base64.b64decode(source.read_text().strip(), validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'dfa13766a43a35f71ee2f84f683bcd560ec6a14b9e5b2141f9f0be822c571273'
          subprocess.run(['git','apply','--index','-'], input=raw, check=True)
          subprocess.run(['git','rm',str(source),'.github/workflows/apply-v2.6.2-report.yml'], check=True)
          subprocess.run(['git','diff','--cached','--check'], check=True)
      - name: Verify manifest, instruction budget and regression suite
        run: |
          python3 tools/verify_manifest.py
          test "$(wc -c < skills/codex-luna-subagent-router/SKILL.md)" -lt 6000
          python3 -m unittest discover -s skills/codex-luna-subagent-router/tests -q
      - name: Commit feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: v2.6.2 新增一键统计简报与数据导出'
          git push origin HEAD:feat/v2.6.2-report
