name: Publish v2.7.0 Stable

on:
  push:
    branches:
      - publish/v2.7.0

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      target: ${{ steps.check.outputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 075fb63f6a80b1a2d3126d92f3e0dadc22f9f30b
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact stable source
        id: check
        shell: bash
        run: |
          set -euo pipefail
          TARGET="075fb63f6a80b1a2d3126d92f3e0dadc22f9f30b"
          [[ "$(git rev-parse HEAD)" == "$TARGET" ]]
          VERSION=$(cat skills/codex-luna-subagent-router/VERSION)
          [[ "$VERSION" == "2.7.0" ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify manifest, full regressions and Router Arena
        run: |
          python tools/verify_manifest.py
          python -m unittest discover -s skills/codex-luna-subagent-router/tests -v
          python benchmarks/router_arena.py route-audit

  packages:
    needs: authorize
    uses: ./.github/workflows/portable-runtime.yml
    with:
      ref: 075fb63f6a80b1a2d3126d92f3e0dadc22f9f30b
    permissions:
      contents: read

  publish:
    needs: [authorize, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 075fb63f6a80b1a2d3126d92f3e0dadc22f9f30b
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: packages
          merge-multiple: true
      - name: Verify all four stable packages
        shell: python
        env:
          VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          import hashlib, os
          from pathlib import Path
          root = Path("packages")
          names = [f"router-{os.environ['VERSION']}-{target}.{ext}" for target, ext in
                   [("windows-x64","zip"),("windows-arm64","zip"),("macos-x64","tar.gz"),("macos-arm64","tar.gz")]]
          assert {p.name for p in root.iterdir()} == set(names + [n+".sha256" for n in names])
          lines = []
          for name in names:
              line = (root / (name + ".sha256")).read_text().strip()
              digest, recorded = line.split("  ", 1)
              assert recorded == name
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest
              lines.append(line)
          (root / "SHA256SUMS").write_text("\n".join(lines) + "\n")
      - name: Publish immutable stable release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.authorize.outputs.version }}
          TARGET: ${{ needs.authorize.outputs.target }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite." >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists; refusing to move it." >&2
            exit 1
          fi
          gh release create "$TAG" \
            --target "$TARGET" \
            --title "$TAG" \
            --draft \
            --notes-file docs/README-v2.7.md
          gh release upload "$TAG" packages/*
          gh release edit "$TAG" --draft=false
