name: Publish v2.6.4 Once

on:
  push:
    branches: ["release/v2.6.4-publish"]
    paths: [".github/workflows/publish-v2.6.4-once.yml"]

permissions:
  contents: read

env:
  TARGET_SHA: e636b1a88cd5edb27aee666217e085f17e19f88f
  RELEASE_VERSION: 2.6.4

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm reviewed main target and unpublished version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq .object.sha)"
          test "$MAIN_SHA" = "$TARGET_SHA"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Tag v${RELEASE_VERSION} already exists; refusing duplicate publication." >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Release v${RELEASE_VERSION} already exists; refusing duplicate publication." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact source, version and report runtime identity
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < skills/codex-luna-subagent-router/VERSION)" = "$RELEASE_VERSION"
          python tools/verify_manifest.py
          python -m unittest discover -s skills/codex-luna-subagent-router/tests -v
          test "$(wc -c < skills/codex-luna-subagent-router/SKILL.md)" -lt 6000
          tmp="$(mktemp -d)"
          CODEX_HOME="$tmp/codex" python skills/codex-luna-subagent-router/scripts/report.py --global-scope --output-dir "$tmp/reports" > "$tmp/report.txt"
          grep -F '`Router v2.6.4`' "$tmp/report.txt"
          REPORT_JSON="$(find "$tmp/reports" -name data.json -print -quit)" python - <<'PY'
          import json, os, sys
          from pathlib import Path
          root = Path('skills/codex-luna-subagent-router')
          scripts = root / 'scripts'
          sys.path.insert(0, str(scripts))
          import outcome_store, route_advisor, report, runtime_support
          version = (root / 'VERSION').read_text(encoding='utf-8').strip()
          assert version == '2.6.4'
          assert runtime_support.skill_version() == version
          assert outcome_store.ROUTER_VERSION == version
          assert route_advisor.ROUTER_VERSION == version
          assert report.ROUTER_VERSION == version
          payload = json.loads(Path(os.environ['REPORT_JSON']).read_text(encoding='utf-8'))
          assert payload['router_version'] == version, payload['router_version']
          PY

  packages:
    needs: authorize
    uses: ./.github/workflows/portable-runtime.yml
    with:
      ref: e636b1a88cd5edb27aee666217e085f17e19f88f
    permissions:
      contents: read

  publish:
    needs: [authorize, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: packages
          merge-multiple: true
      - name: Verify all four complete platform archives
        shell: python
        run: |
          import hashlib
          import os
          from pathlib import Path
          version = os.environ['RELEASE_VERSION']
          root = Path('packages')
          names = [
              f'router-{version}-windows-x64.zip',
              f'router-{version}-windows-arm64.zip',
              f'router-{version}-macos-x64.tar.gz',
              f'router-{version}-macos-arm64.tar.gz',
          ]
          expected = set(names + [name + '.sha256' for name in names])
          actual = {p.name for p in root.iterdir()}
          assert actual == expected, (actual, expected)
          lines = []
          for name in names:
              digest, recorded = (root / (name + '.sha256')).read_text(encoding='utf-8').strip().split('  ', 1)
              assert recorded == name
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest
              lines.append(f'{digest}  {name}')
          (root / 'SHA256SUMS').write_text('\n'.join(lines) + '\n', encoding='utf-8')
      - name: Publish v2.6.4 stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > RELEASE_NOTES.md <<'EOF'
          ## v2.6.4

          这是针对 v2.6.3 实测发现的版本标识问题的修复版。

          ### 修复
          - 修复 `router report` 在 v2.6.3 完整包中仍显示 `Router v2.6.2` 的问题。
          - 根因是 outcome 存储模块仍维护独立的硬编码 Router 版本；现在产品版本统一从 Skill 根目录 `VERSION` 读取。
          - `report`、Route Advisor、新建 receipt 与 outcome 元数据都会自动使用当前安装包版本，后续发版不再需要同步第二个硬编码产品版本。
          - 既有历史 outcome / receipt 保持原样读取，不回写或伪造历史版本字段。
          - `turn_usage preview` 在当前没有 active turn 时不生成额外 token 摘要仍是预期行为，本版未改变。

          ### 保持兼容
          - v2.6.3 的 Evidence reuse 协议继续保留。
          - `router report` 仍是自 v2.6.2 起提供的只读统计简报功能。
          - 路由策略、并发、hooks、token 采集与账本格式均未改变。

          ### 验证
          - 331 项回归测试通过。
          - 发布流程真实执行 `report.py` 并确认聊天标题与 JSON 均为 `2.6.4`。
          - Windows x64 / ARM64 与 macOS Intel / Apple Silicon 四个平台完整包均使用随包 Python 完成构建、安装/升级、hooks 和完整回归。
          - Release 附带四个平台完整包、逐包 `.sha256` 与汇总 `SHA256SUMS`。

          > GitHub 自动生成的 Source code ZIP/TAR 不包含 Python 运行时。普通用户请下载对应平台的 `router-2.6.4-*` 完整包。
          EOF
          TAG="v${RELEASE_VERSION}"
          gh release create "$TAG" --target "$TARGET_SHA" --title "$TAG" --draft --notes-file RELEASE_NOTES.md
          gh release upload "$TAG" packages/*
          gh release edit "$TAG" --draft=false --prerelease=false
