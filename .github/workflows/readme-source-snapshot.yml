name: README source snapshot
on:
  push:
    branches: [docs/readme-refresh-20260915]
    paths: [.github/workflows/readme-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source
        run: git archive --format=zip HEAD -o /tmp/readme-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: readme-source
          path: /tmp/readme-source.zip
          retention-days: 1
