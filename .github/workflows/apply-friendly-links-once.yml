name: Apply Friendly Links Once

on:
  push:
    branches: ["docs/friendly-links"]
    paths: [".github/workflows/apply-friendly-links-once.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/friendly-links
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Append friendly links and update manifest
        shell: python
        run: |
          from pathlib import Path
          import hashlib

          files = {
              Path('README.md'): '## 友情链接\n\n[![认可linux.do](https://ld.xh.do/ld-badge.svg)](https://linux.do)',
              Path('README.en.md'): '## Friendly links\n\n[![认可linux.do](https://ld.xh.do/ld-badge.svg)](https://linux.do)',
          }

          for path, block in files.items():
              text = path.read_text(encoding='utf-8').rstrip()
              if block not in text:
                  text += '\n\n' + block
              path.write_text(text + '\n', encoding='utf-8')

          manifest = Path('MANIFEST.sha256')
          lines = manifest.read_text(encoding='utf-8').splitlines()
          digests = {str(path): hashlib.sha256(path.read_bytes()).hexdigest() for path in files}
          out = []
          seen = set()
          for line in lines:
              digest, rel = line.split('  ', 1)
              if rel in digests:
                  digest = digests[rel]
                  seen.add(rel)
              out.append(f'{digest}  {rel}')
          assert seen == set(digests), (seen, digests)
          manifest.write_text('\n'.join(out) + '\n', encoding='utf-8')

          assert Path('README.md').read_text(encoding='utf-8').count('## 友情链接') == 1
          assert Path('README.en.md').read_text(encoding='utf-8').count('## Friendly links') == 1
          assert '[![认可linux.do](https://ld.xh.do/ld-badge.svg)](https://linux.do)' in Path('README.md').read_text(encoding='utf-8')
          assert '[![认可linux.do](https://ld.xh.do/ld-badge.svg)](https://linux.do)' in Path('README.en.md').read_text(encoding='utf-8')
      - name: Remove one-shot workflow and commit final docs
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-friendly-links-once.yml
          git config user.name "Ethen Lee"
          git config user.email "soldiers@vip.qq.com"
          git add README.md README.en.md MANIFEST.sha256 .github/workflows/apply-friendly-links-once.yml
          git diff --cached --check
          git commit -m "docs: 添加 linux.do 友情链接"
          git push origin HEAD:docs/friendly-links
