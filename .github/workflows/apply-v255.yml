name: apply v2.5.5 patch
on:
  push:
    branches: [v2.5.5-host-first-concurrency]
    paths: [.github/workflows/apply-v255.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.5.5-host-first-concurrency
      - name: Reassemble and apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat <<'SUMS' | sha256sum -c -
          29780fcc85cd156c7f50a76c86cffeda9ef912694d0241413165940f756c48b3  .github/v255.chunk00.b64
          39c249336d015bcecffbc1c59164153762034c52124b3f0d8bb05518f927e6a8  .github/v255.chunk01a.b64
          7a28922a12fdbe0f407e6fac073aff154d9e9a3498b7880b737595c4c6e82147  .github/v255.chunk01b.b64
          a58aef53024c6cc974db82204f0f1ea356d9a34aa6228a034b3e5882df85ce9f  .github/v255.chunk01c.b64
          bb94a98d3b368f677fcf182d2c726ee4ddf7e057b4a842b4e78eced3dd344287  .github/v255.chunk02.b64
          2e6d3649080bb8ec9193aa63cce04f3e785984b3723a7708075d1125e5223629  .github/v255.chunk03.b64
          SUMS
          : > /tmp/v255.patch.gz
          for f in \
            .github/v255.chunk00.b64 \
            .github/v255.chunk01a.b64 \
            .github/v255.chunk01b.b64 \
            .github/v255.chunk01c.b64 \
            .github/v255.chunk02.b64 \
            .github/v255.chunk03.b64; do
            base64 -d "$f" >> /tmp/v255.patch.gz
          done
          gzip -dc /tmp/v255.patch.gz > /tmp/v255.patch
          echo 'a3a471019266346b28b046afa195fa12219545df90f7e98b09eacb7737e67d4d  /tmp/v255.patch' | sha256sum -c -
          git apply --check /tmp/v255.patch
          git apply /tmp/v255.patch
          rm -f .github/v255.chunk*.b64 .github/workflows/apply-v255.yml
          git diff --check
      - name: Commit functional changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ethen Lee"
          git config user.email "soldiers@vip.qq.com"
          git add -A
          git commit -m "feat: v2.5.5 Host-first 并发兼容与 CLI 解耦"
          git push origin HEAD:v2.5.5-host-first-concurrency
