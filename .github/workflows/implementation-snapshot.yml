name: Implementation snapshot
on:
  push:
    branches: [v2.5.1-outcome-collection]
    paths: [.github/workflows/implementation-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive HEAD -o source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: source.tar
          retention-days: 1
