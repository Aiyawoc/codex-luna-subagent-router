name: apply v2.5.4 patch

on:
  push:
    branches: [v2.5.4-runtime-lifecycle-accounting]
    paths: [.github/workflows/apply-v254.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.5.4-runtime-lifecycle-accounting
      - name: Apply prepared patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/v254.gz.b64.* | base64 -d | gzip -d > /tmp/v254.patch
          git apply --check /tmp/v254.patch
          git apply /tmp/v254.patch
          git diff --check
      - name: Commit functional changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ethen Lee"
          git config user.email "soldiers@vip.qq.com"
          git add -A
          git commit -m "feat: v2.5.4 运行时生命周期、Worker 复用与本轮用量修复"
          git push origin HEAD:v2.5.4-runtime-lifecycle-accounting
