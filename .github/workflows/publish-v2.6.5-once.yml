name: Publish v2.6.5 Once

on:
  push:
    branches:
      - release/v2.6.5-publish

permissions:
  contents: write
  actions: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.guard.outputs.target_sha }}
    steps:
      - name: Verify immutable release target
        id: guard
        shell: bash
        env:
          TARGET_SHA: 7d1149840ad83500dc52177eddfb2ca1fe46d7a8
          RELEASE_VERSION: 2.6.5
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          test "$MAIN_SHA" = "$TARGET_SHA"
          if git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "tag v${RELEASE_VERSION} already exists" >&2
            exit 1
          fi
          if gh release view "v${RELEASE_VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release v${RELEASE_VERSION} already exists" >&2
            exit 1
          fi
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: 7d1149840ad83500dc52177eddfb2ca1fe46d7a8
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify v2.6.5 source and release contracts
        shell: bash
        env:
          PYTHONUTF8: '1'
        run: |
          set -euo pipefail
          test "$(cat skills/codex-luna-subagent-router/VERSION)" = "2.6.5"
          python tools/verify_manifest.py
          python -m unittest discover -s skills/codex-luna-subagent-router/tests -v
          python - <<'PY'
          from pathlib import Path
          import sys
          root = Path("skills/codex-luna-subagent-router")
          sys.path.insert(0, str(root / "scripts"))
          import runtime_support
          import outcome_store
          import route_advisor
          import report
          expected = "2.6.5"
          assert runtime_support.skill_version(root) == expected
          assert outcome_store.ROUTER_VERSION == expected
          assert route_advisor.ROUTER_VERSION == expected
          assert report.ROUTER_VERSION == expected
          assert len((root / "references" / "AGENTS-snippet.md").read_bytes()) < 1000
          PY
          rm -rf "$RUNNER_TEMP/codex-home" "$RUNNER_TEMP/report"
          mkdir -p "$RUNNER_TEMP/codex-home"
          CODEX_HOME="$RUNNER_TEMP/codex-home" python skills/codex-luna-subagent-router/scripts/report.py \
            --global-scope --output-dir "$RUNNER_TEMP/report" > "$RUNNER_TEMP/report.out"
          grep -F 'Router v2.6.5' "$RUNNER_TEMP/report.out"
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads((Path(os.environ["RUNNER_TEMP"]) / "report" / "data.json").read_text())
          assert payload["router_version"] == "2.6.5"
          PY
          ! grep -F 'router-2.6.4-' README.md README.en.md
          ! grep -F '/releases/tag/v2.6.4' README.md README.en.md

  portable:
    needs: authorize
    uses: ./.github/workflows/portable-runtime.yml
    with:
      ref: 7d1149840ad83500dc52177eddfb2ca1fe46d7a8
    permissions:
      contents: read

  publish:
    needs:
      - authorize
      - portable
    runs-on: ubuntu-latest
    steps:
      - name: Download verified platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: packages
          merge-multiple: true

      - name: Verify four complete platform archives
        shell: bash
        run: |
          set -euo pipefail
          cd packages
          expected=(
            "router-2.6.5-windows-x64.zip"
            "router-2.6.5-windows-arm64.zip"
            "router-2.6.5-macos-x64.tar.gz"
            "router-2.6.5-macos-arm64.tar.gz"
          )
          for archive in "${expected[@]}"; do
            test -f "$archive"
            test -f "$archive.sha256"
            sha256sum -c "$archive.sha256"
          done
          printf '%s\n' "${expected[@]}" | xargs sha256sum > SHA256SUMS
          test "$(wc -l < SHA256SUMS | tr -d ' ')" = "4"

      - name: Publish v2.6.5 stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 7d1149840ad83500dc52177eddfb2ca1fe46d7a8
        run: |
          set -euo pipefail
          if gh release view v2.6.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release v2.6.5 already exists" >&2
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          # Agent Router v2.6.5

          v2.6.5 consolidates the Agent Router naming, standing delegation refresh, and compact Token Hook display introduced after v2.6.4.

          - **Agent Router naming:** current user-facing docs and Codex display metadata use Agent Router, while the stable Skill ID remains \`$codex-luna-subagent-router\`.
          - **Standing delegation refresh:** guided-install inventory now detects current, stale, and malformed managed \`AGENTS.md\` authorization blocks. Older blocks are prompted for safe refresh instead of being treated as current solely because markers exist.
          - **Automatic delegation wording:** the managed authorization explicitly asks the Lead to evaluate delegation each turn and invoke the canonical Skill ID when cost benefit, capability gap, or independent-review value justifies it.
          - **Compact main Hook panel:** main \`Stop\` output uses blank-line grouping plus \`input (cached, hit rate) · output\`, while still aggregating safely associated SubAgents and completeness.
          - **Compact SubAgent Hook panel:** \`SubagentStop\` uses the same shared usage formatter and omits redundant totals/status prose; detailed diagnostics remain available in stats/diagnostics.
          - **README refresh:** capabilities now precede Quick Start; Agent/Codex installation is the first path, followed by complete manual download, checksum, and installation steps.

          Complete macOS and Windows packages include the pinned private CPython runtime. GitHub's automatically generated Source code archives do **not** contain that runtime; end users should download one of the \`router-2.6.5-*\` assets below.

          Validation: full regression suite, manifest verification, and packaged-runtime install/upgrade/hooks/full-test checks on Windows x64, Windows ARM64, macOS Intel, and macOS Apple Silicon.
          EOF
          gh release create v2.6.5 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "v2.6.5" \
            --draft \
            --notes-file release-notes.md
          gh release upload v2.6.5 --repo "$GITHUB_REPOSITORY" \
            packages/router-2.6.5-windows-x64.zip \
            packages/router-2.6.5-windows-x64.zip.sha256 \
            packages/router-2.6.5-windows-arm64.zip \
            packages/router-2.6.5-windows-arm64.zip.sha256 \
            packages/router-2.6.5-macos-x64.tar.gz \
            packages/router-2.6.5-macos-x64.tar.gz.sha256 \
            packages/router-2.6.5-macos-arm64.tar.gz \
            packages/router-2.6.5-macos-arm64.tar.gz.sha256 \
            packages/SHA256SUMS
          gh release edit v2.6.5 --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false
