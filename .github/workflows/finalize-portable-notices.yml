name: Finalize Portable Notices
on:
  push:
    branches: [feat/bundled-python-runtime]
    paths: [.github/workflows/finalize-portable-notices.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Aiyawoc/codex-luna-subagent-router' && github.actor == 'Aiyawoc'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply checksum-verified tested patch and remove temporary workflow
        shell: python
        run: |
          import base64, hashlib, lzma, subprocess
          encoded = ''''''
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '34b0bcab20a91d0889f2cce5a29c74210c6922f8c5e57f0c9f594eeb243150eb'
          subprocess.run(['git','apply','--index','-'],input=raw,check=True)
          subprocess.run(['git','rm','.github/workflows/finalize-portable-notices.yml'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          tree=subprocess.check_output(['git','write-tree']).decode().strip()
          assert tree == '68e8ff89a6d1b9fa05ee870d6bd9f4fe8c042f88', tree
      - name: Commit verified source only to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: 补齐精简包第三方许可来源并修复安装锁清理'
          git push origin HEAD:feat/bundled-python-runtime
