name: Publish v2.6.6 Once

on:
  push:
    branches:
      - release/v2.6.6-publish

permissions:
  contents: write
  actions: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Verify immutable release target
        shell: bash
        env:
          TARGET_SHA: c139e74ca7e7c32fa4b3590fcf56829c51ae30b6
          RELEASE_VERSION: 2.6.6
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          test "$MAIN_SHA" = "$TARGET_SHA"
          if git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "tag v${RELEASE_VERSION} already exists" >&2
            exit 1
          fi
          if gh release view "v${RELEASE_VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release v${RELEASE_VERSION} already exists" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: c139e74ca7e7c32fa4b3590fcf56829c51ae30b6
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify v2.6.6 source
        shell: bash
        env:
          PYTHONUTF8: '1'
        run: |
          set -euo pipefail
          test "$(cat skills/codex-luna-subagent-router/VERSION)" = "2.6.6"
          python tools/verify_manifest.py
          python -m unittest discover -s skills/codex-luna-subagent-router/tests -v
          ! grep -F 'router-2.6.5-' README.md README.en.md
          ! grep -F '/releases/tag/v2.6.5' README.md README.en.md

  portable:
    needs: authorize
    uses: ./.github/workflows/portable-runtime.yml
    with:
      ref: c139e74ca7e7c32fa4b3590fcf56829c51ae30b6
    permissions:
      contents: read

  publish:
    needs:
      - authorize
      - portable
    runs-on: ubuntu-latest
    steps:
      - name: Download verified platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: packages
          merge-multiple: true

      - name: Verify four complete platform archives
        shell: bash
        run: |
          set -euo pipefail
          cd packages
          expected=(
            "router-2.6.6-windows-x64.zip"
            "router-2.6.6-windows-arm64.zip"
            "router-2.6.6-macos-x64.tar.gz"
            "router-2.6.6-macos-arm64.tar.gz"
          )
          for archive in "${expected[@]}"; do
            test -f "$archive"
            test -f "$archive.sha256"
            sha256sum -c "$archive.sha256"
          done
          printf '%s\n' "${expected[@]}" | xargs sha256sum > SHA256SUMS
          test "$(wc -l < SHA256SUMS | tr -d ' ')" = "4"

      - name: Publish v2.6.6 stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: c139e74ca7e7c32fa4b3590fcf56829c51ae30b6
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          # Agent Router v2.6.6

          v2.6.6 contains the post-v2.6.5 documentation and SubAgent token-accounting fixes.

          - Added README examples for using Agent Router results with @Visualize, including an interactive data brief dashboard, Token/cache trends, RoutePlan/Worker DAG, and routing-decision visualization.
          - Fixed sibling contamination in multi-SubAgent token accounting: a healthy child that reaches SubagentStop now persists its exact transcript locator and end boundary into the parent turn immediately.
          - When a parent turn is sealed before its normal Stop, missing child locator/end boundaries can be recovered from the exact parent_id + agent_id + scope usage record.
          - A late healthy SubagentStop recovers only that exact child snapshot, so another sibling with missing SubagentStop no longer invalidates the healthy child's known usage.
          - Interrupted Worker Recovery is not included in this release and remains a separate follow-up design.

          Complete macOS and Windows packages include the pinned private CPython runtime. GitHub's automatically generated Source code archives do not contain that runtime.
          EOF
          gh release create v2.6.6 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "v2.6.6" \
            --draft \
            --notes-file release-notes.md
          gh release upload v2.6.6 --repo "$GITHUB_REPOSITORY" \
            packages/router-2.6.6-windows-x64.zip \
            packages/router-2.6.6-windows-x64.zip.sha256 \
            packages/router-2.6.6-windows-arm64.zip \
            packages/router-2.6.6-windows-arm64.zip.sha256 \
            packages/router-2.6.6-macos-x64.tar.gz \
            packages/router-2.6.6-macos-x64.tar.gz.sha256 \
            packages/router-2.6.6-macos-arm64.tar.gz \
            packages/router-2.6.6-macos-arm64.tar.gz.sha256 \
            packages/SHA256SUMS
          gh release edit v2.6.6 --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false
